    <text x="600" y="336" fill="#7ADFFF" font-family="Space Grotesk, Arial, sans-serif" font-size="26" font-weight="500" letter-spacing="5.2">A SHORT PUBLIC LOOK AT THE UPCOMING AI TRUST WORKFLOW</text>
    <text x="600" y="402" fill="#C6D6E8" font-family="Space Grotesk, Arial, sans-serif" font-size="26" font-weight="500">Signal structure. Route validation. Proof consistency.</text>
    <text x="600" y="442" fill="#C6D6E8" font-family="Space Grotesk, Arial, sans-serif" font-size="26" font-weight="500">Public for one week only.</text>
  </g>

  <g opacity="0.72">
