      <stop stop-color="#071223"/>
      <stop offset="1" stop-color="#0F1A38"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 80) scale(560 180)">
      <stop stop-color="#34E6FF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#34E6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leftGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 210) scale(320 280)">
      <stop stop-color="#3CEBFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3CEBFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1020 220) scale(360 320)">
      <stop stop-color="#997DFF" stop-opacity="0.2"/>
