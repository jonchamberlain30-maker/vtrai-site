  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#topGlow)"/>
  <rect width="1200" height="630" fill="url(#leftGlow)"/>
  <rect width="1200" height="630" fill="url(#rightGlow)"/>

  <g opacity="0.16">
