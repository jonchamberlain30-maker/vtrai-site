    <path d="M60 220H1140" stroke="url(#grid)" stroke-width="1"/>
    <path d="M60 330H1140" stroke="url(#grid)" stroke-width="1"/>
    <path d="M60 440H1140" stroke="url(#grid)" stroke-width="1"/>
    <path d="M60 550H1140" stroke="url(#grid)" stroke-width="1"/>
    <path d="M155 46V584" stroke="url(#grid)" stroke-width="1"/>
    <path d="M295 46V584" stroke="url(#grid)" stroke-width="1"/>
    <path d="M435 46V584" stroke="url(#grid)" stroke-width="1"/>
    <path d="M575 46V584" stroke="url(#grid)" stroke-width="1"/>
